name: Deploy Next.js Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build portfolio
        run: |
          npm run build

          python3 - <<'PY'
          from pathlib import Path

          output_folder = Path("out")

          for file in output_folder.rglob("*"):
              if file.is_file() and file.suffix.lower() in [".html", ".css", ".js"]:
                  content = file.read_text(encoding="utf-8")

                  content = content.replace('src="/', 'src="/Portfolio/')
                  content = content.replace('href="/', 'href="/Portfolio/')
                  content = content.replace('url("/', 'url("/Portfolio/')
                  content = content.replace("url('/", "url('/Portfolio/")

                  file.write_text(content, encoding="utf-8")
          PY

      - name: Upload Next.js output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4